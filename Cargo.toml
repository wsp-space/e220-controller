[package]
name = "e220-controller"
version = "0.4.0"
edition = "2021"
description = "E220 LoRa module controller with a GPUI desktop frontend"
license = "MIT"
repository = "https://github.com/wsp-space/e220-controller"
publish = false

[dependencies]
async-channel = "2"
chrono = "0.4"
gpui-kit = "0.7"
serde = { version = "1", features = ["derive"] }
serialport = "4"
toml = "0.8"
velopack = "=1.2.161"

[build-dependencies]
winresource = "0.1"
